[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csid"
version = "1.0.0"
description = "Cardinality-Stratified Interaction Decomposition for transactional basket data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "tabulate>=0.9",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]

[project.scripts]
csid = "csid.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.9",
  "mypy>=1.15",
  "pyarrow>=14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["csid"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["csid"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["\\.venv", "build", "dist", "outputs"]
